# =====================================================
# 配置文件模板 - 请复制为 application.yml 使用
# 请填写你自己的配置信息
# =====================================================

# application.yml
# 项目相关配置
ruoyi:
  name: RuoYi
  version: 3.9.2
  copyrightYear: 2026
  profile: D:/ruoyi/uploadPath
  addressEnabled: false
  captchaType: math

# AI 配置
ai:
  default-provider: zhipuai
  fallback-provider: deepseek
  providers:
    zhipuai:
      name: 智谱AI
      model: glm-4-plus
      enabled: true
    deepseek:
      name: DeepSeek
      model: deepseek-chat
      enabled: true
    openai:
      name: OpenAI
      model: gpt-3.5-turbo
      enabled: false
  rag:
    similarity-threshold: 0.75
    top-k: 3

# Spring配置
spring:
  messages:
    basename: i18n/messages
  profiles:
    active: druid
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  devtools:
    restart:
      enabled: true
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      password: 【填写你的Redis密码，如果没有则留空】
      timeout: 10s
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms
  ai:
    zhipuai:
      api-key: 【填写你的智谱AI API Key】
      base-url: https://open.bigmodel.cn/api/paas
      chat:
        enabled: true
        options:
          model: glm-4-plus
          temperature: 0.7
          max-tokens: 2048
    openai:
      api-key: 【填写你的DeepSeek/OpenAI API Key】
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
          max-tokens: 2048
    siliconflow:
      api-key: 【填写你的SiliconFlow API Key】
      base-url: https://api.siliconflow.cn
      chat:
        options:
          model: PaddlePaddle/PaddleOCR-VL-1.5
          temperature: 0.1
          max-tokens: 4096

server:
  port: 8086
  servlet:
    context-path: /
  tomcat:
    uri-encoding: UTF-8
    accept-count: 1000
    threads:
      max: 800
      min-spare: 100

logging:
  level:
    com.openstudy: debug
    com.openstudy.framework.security.filter: debug
    org.springframework: warn
    org.springframework.ai: debug
    org.springframework.security: info

user:
  password:
    maxRetryCount: 5
    lockTime: 10

# 【重要】修改为你的 JWT 密钥
token:
  header: Authorization
  secret: 【填写你的JWT密钥，至少32位】
  expireTime: 30

security:
  permit-all:
    urls:
      - /login
      - /register
      - /captchaImage
      - /ai/**
      - /rag/**

mybatis:
  typeAliasesPackage: com.openstudy.**.domain
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  configLocation: classpath:mybatis/mybatis-config.xml

pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '默认接口'
      paths-to-match: '/**'
      packages-to-scan: com.openstudy.web.controller

referer:
  enabled: false
  allowed-domains: localhost,127.0.0.1

xss:
  enabled: true
  excludes: /system/notice
  urlPatterns: /system/*,/monitor/*,/tool/*
